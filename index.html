<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Canvas</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./styles/styles.css">
  </head>

  <body>
    <header>
      <div class="container row">
        <div class="brand">
          <div class="logo"></div>
          <div class="title">Code Canvas</div>
        </div>
        <div class="row">
          <button class="btn secondary" id="saveBtn" title="Save work locally"><span>Save</span></button>
          <button class="btn secondary" id="loadBtn" title="Load work from file"><span>Load</span></button>
          <input type="file" id="fileInput" accept="application/json" hidden>
        </div>
      </div>
    </header>
    <main>
      <aside class="stack panel card">
        <h2>Task / Assignment</h2>
        <textarea class="text" id="assignment" placeholder="Write the task description here..."></textarea>
        <div class="stack">
          <label for="testArea">Validation tests (JavaScript only - optional)</label>
          <textarea class="text" id="testArea"
            placeholder="Write simple tests to append after the students' code to chek the solution..."></textarea>
        </div>
        <div class="muted">
          <p>Tip: <span class="kbd">Ctrl</span> + <span class="kbd">S</span> to save, <span class="kbd">Ctrl</span> +
            <span class="kbd">Enter</span> to run
          </p>
        </div>
      </aside>
      <section class="stack">
        <div class="stack panel card" id="webEditors">
          <div class="row">
            <h2>HTML / CSS / JS</h2>
            <div class="row">
              <button class="btn ok" id="runWeb">Run</button>
              <button class="btn secondary" id="openPreview">Open preview in a new window</button>
            </div>
          </div>
          <div class="tabs" id="webTabs" role="tablist" aria-label="Web Editors">
            <button class="tab active" role="tab" aria-selected="true" tabindex="0" data-pane="html">HTML</button>
            <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="css">CSS</button>
            <button class="tab" role="tab" aria-selected="false" tabindex="-1" data-pane="js">JS</button>
          </div>
          <div class="editor-wrap" data-pane="html">
            <div class="editor" id="ed_html"></div>
          </div>
          <div class="editor-wrap" data-pane="css" hidden>
            <div class="editor" id="ed_css"></div>
          </div>
          <div class="editor-wrap" data-pane="js" hidden>
            <div class="editor" id="ed_js"></div>
          </div>
          <div class="stack">
            <h3>Preview</h3>
            <iframe class="preview" id="preview"
              sandbox="allow-scripts allow-same-origin allow-modals allow-forms"></iframe>
          </div>
        </div>
      </section>
      <aside class="stack panel card">
        <h2>Output</h2>
        <div class="output" id="output" aria-live="polite"></div>
        <div class="row">
          <button class="btn warn" id="runTests">Run with tests</button>
          <button class="btn secondary" id="clearOutput">Clear output</button>
        </div>
        <h3>Notes</h3>
        <ul class="muted">
          <li>Everything runs inside the browser in a sandbox</li>
          <li>You can save the work as a JSON file and restore it</li>
        </ul>
      </aside>
      <footer>
        &copy; 2026 All rights reserved.
      </footer>
    </main>
  </body>

</html>
