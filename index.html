<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Editor</title>
  </head>

  <body>
    <header>
      <div class="container row">
        <div class="brand">
          <div class="logo"></div>
          <div class="title">Code Editor</div>
        </div>
        <div class="row">
          <button class="btn secondary" id="saveBtn" title="Save work locally"><span>Save</span></button>
          <button class="btn secondary" id="loadBtn" title="Load work from file"><span>Load</span></button>
          <input type="file" id="fileInput" accept="application/json" hidden>
        </div>
      </div>
    </header>
    <main>
      <aside class="card panel stack">
        <h2>Task / Assignment</h2>
        <textarea class="text" id="assignment" placeholder="Write the task description here..."></textarea>
        <div class="stack">
          <label for="testArea">Validation tests (JavaScript only - optional)</label>
          <textarea class="text" id="testArea"
            placeholder="Write simple tests to append after the students' code to chek the solution..."></textarea>
        </div>
        <div class="muted">
          <p>Tip: <span class="kbd">Ctrl</span> + <span class="kbd">S</span> to save, <span class="kbd">Ctrl</span> +
            <span class="kbd">Enter</span> to run
          </p>
        </div>
      </aside>
    </main>
  </body>

</html>
